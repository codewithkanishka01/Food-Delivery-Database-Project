<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foody | Cart & Checkout</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <!-- Dynamic Background Elements -->
    <div class="hero-background"></div>
    <div class="hero-overlay"></div>

    <nav class="glass-nav">
        <a href="menu.html" class="logo" style="text-decoration: none;">
            <i class="ph ph-arrow-left"></i> Back to Menu
        </a>
    </nav>

    <main class="container cart-page-layout">
        <h1 class="page-title">Review Your Order</h1>
        
        <div class="cart-split">
            <!-- Left: Items List -->
            <div class="cart-items-panel glass card-shadow" id="cartItemsContainer">
                <div class="empty-cart" id="emptyCartView">
                    <i class="ph ph-shopping-cart"></i>
                    <p>Your cart is empty.</p>
                    <a href="menu.html" class="primary-btn mt-4 inline-block">Browse Menu</a>
                </div>
            </div>

            <!-- Right: Checkout Summary -->
            <div class="checkout-summary-panel glass card-shadow">
                <h2>Order Summary</h2>
                
                <div class="summary-details" id="summaryDetails">
                    <div class="summary-row">
                        <span>Customer Name</span>
                        <span id="summaryName" class="font-bold"></span>
                    </div>
                </div>

                <div class="cart-total mt-4 border-t pt-4">
                    <span>Grand Total</span>
                    <span id="grandTotal" class="gradient-text font-bold text-2xl">₹0.00</span>
                </div>

                <button class="checkout-btn mt-4" id="checkoutBtn" disabled>
                    Place Order Now <i class="ph ph-check-circle"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- Success Modal -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-content glass-card card-shadow">
            <div class="success-icon">
                <i class="ph-fill ph-check-circle"></i>
            </div>
            <h2>Order Confirmed!</h2>
            <p>Thank you <span id="receiptName"></span>. Preparing your food now.</p>
            
            <div class="receipt">
                <div id="receiptItems"></div>
                <div class="receipt-total">
                    <span>Grand Total</span>
                    <span id="receiptTotal"></span>
                </div>
            </div>
            
            <button class="primary-btn mt-4" id="newOrderBtn">Start New Order</button>
        </div>
    </div>

    <div id="toast" class="toast hidden">
        <i class="ph ph-info"></i>
        <span id="toastMsg">Notification</span>
    </div>

    <script src="static/script.js"></script>
</body>
</html>
