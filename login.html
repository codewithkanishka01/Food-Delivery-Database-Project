<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foody | Welcome</title>
    <!-- Google Fonts for Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="flex-center">
    <!-- Dynamic Background Elements -->
    <div class="hero-background"></div>
    <div class="hero-overlay"></div>

    <main class="login-container glass-card">
        <div class="login-header">
            <div class="logo-large">
                <i class="ph-fill ph-hamburger"></i> Foody
            </div>
            <h1>Welcome! Let's get started.</h1>
            <p>Enter your name to browse today's exclusive menu.</p>
        </div>
        
        <form id="loginForm" class="login-form">
            <input type="text" id="customerNameInput" placeholder="Your Name" required autocomplete="off" autofocus>
            <button type="submit" class="primary-btn full-width">
                Proceed to Menu <i class="ph ph-arrow-right"></i>
            </button>
        </form>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
